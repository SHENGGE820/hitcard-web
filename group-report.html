<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎓 期末報告作品集</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      color: #1e293b;
    }

    /* ===== Top Bar ===== */
    .topbar {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 64px;
    }

    .topbar-logo {
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      flex: 1;
    }

    .nav-btn {
      padding: 9px 20px;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      box-shadow: 0 3px 12px rgba(99,102,241,0.35);
    }

    .nav-btn:not(.active) {
      background: #f1f5f9;
      color: #64748b;
    }

    .nav-btn:not(.active):hover {
      background: #e2e8f0;
      color: #475569;
    }

    /* ===== Container ===== */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }

    /* ===== Views ===== */
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.3s; }

    /* ===== Home ===== */
    .home-header {
      text-align: center;
      margin-bottom: 44px;
      color: white;
    }

    .home-header h1 {
      font-size: 38px;
      font-weight: 900;
      text-shadow: 0 2px 12px rgba(0,0,0,0.2);
      margin-bottom: 8px;
    }

    .home-header p {
      font-size: 16px;
      opacity: 0.88;
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    /* ===== Group Card ===== */
    .group-card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      transition: transform 0.22s, box-shadow 0.22s;
      cursor: pointer;
    }

    .group-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.16);
    }

    .card-header {
      height: 86px;
      display: flex;
      align-items: center;
      padding: 20px 22px;
      gap: 16px;
    }

    .c0 { background: linear-gradient(135deg, #667eea, #764ba2); }
    .c1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .c2 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .c3 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
    .c4 { background: linear-gradient(135deg, #fa709a, #fee140); }
    .c5 { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
    .c6 { background: linear-gradient(135deg, #fd7043, #ffa726); }
    .c7 { background: linear-gradient(135deg, #26c6da, #00acc1); }
    .c8 { background: linear-gradient(135deg, #66bb6a, #43a047); }
    .c9 { background: linear-gradient(135deg, #ef5350, #b71c1c); }

    .card-num {
      width: 46px;
      height: 46px;
      background: rgba(255,255,255,0.28);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: white;
      flex-shrink: 0;
    }

    .card-group-name {
      font-size: 18px;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 6px rgba(0,0,0,0.2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-body { padding: 18px 22px 12px; }

    .card-topic {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 12px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .card-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      background: #f1f5f9;
      border-radius: 20px;
      padding: 4px 11px;
      font-size: 12px;
      color: #475569;
      font-weight: 500;
    }

    .chip.more { background: #ede9fe; color: #6366f1; }

    .card-footer {
      padding: 10px 14px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-sm {
      padding: 7px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-view  { background: #ede9fe; color: #6366f1; }
    .btn-view:hover  { background: #6366f1; color: white; }
    .btn-edit  { background: #fef3c7; color: #d97706; }
    .btn-edit:hover  { background: #f59e0b; color: white; }
    .btn-del   { background: #fee2e2; color: #ef4444; margin-left: auto; }
    .btn-del:hover   { background: #ef4444; color: white; }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      bottom: 36px;
      right: 36px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #f5576c);
      color: white;
      font-size: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(99,102,241,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      z-index: 80;
    }

    .fab:hover { transform: scale(1.1) rotate(45deg); }

    /* ===== Empty / Loading ===== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.85);
    }

    .empty-state .icon { font-size: 70px; margin-bottom: 16px; }
    .empty-state h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .empty-state p { font-size: 15px; opacity: 0.8; }

    .loading-msg {
      text-align: center;
      padding: 60px;
      color: rgba(255,255,255,0.85);
      font-size: 17px;
    }

    /* ===== Form View ===== */
    .form-wrap {
      background: white;
      border-radius: 26px;
      padding: 40px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.14);
      max-width: 720px;
      margin: 0 auto;
    }

    .form-heading {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 32px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-group { margin-bottom: 24px; }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 9px;
    }

    .form-group input[type=text],
    .form-group input[type=number],
    .form-group input[type=url],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 13px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
      color: #1e293b;
      background: white;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.7;
    }

    /* Dynamic rows */
    .dyn-list { display: flex; flex-direction: column; gap: 8px; }

    .dyn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dyn-row input { flex: 1; }

    .dyn-row .sub-input {
      width: 150px;
      flex-shrink: 0;
    }

    .btn-rm {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: none;
      background: #fee2e2;
      color: #ef4444;
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-rm:hover { background: #ef4444; color: white; }

    .btn-add-row {
      margin-top: 8px;
      padding: 9px 16px;
      border-radius: 11px;
      border: 2px dashed #c7d2fe;
      background: transparent;
      color: #6366f1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      text-align: center;
    }

    .btn-add-row:hover { background: #ede9fe; border-color: #6366f1; }

    /* Photo preview */
    .photo-thumb {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      display: none;
      flex-shrink: 0;
    }

    /* Form actions */
    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 15px 36px;
      border-radius: 13px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 10px rgba(99,102,241,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(99,102,241,0.4);
    }

    .btn-secondary {
      padding: 15px 26px;
      border-radius: 13px;
      border: 2px solid #e2e8f0;
      background: transparent;
      color: #64748b;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-secondary:hover { border-color: #94a3b8; color: #475569; }

    /* ===== Modal ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.55);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      overflow-y: auto;
    }

    .overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 26px;
      width: 100%;
      max-width: 820px;
      margin: auto;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.3);
    }

    .modal-hd {
      min-height: 100px;
      display: flex;
      align-items: center;
      padding: 24px 30px;
      gap: 18px;
    }

    .modal-num {
      width: 54px;
      height: 54px;
      background: rgba(255,255,255,0.28);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: white;
      flex-shrink: 0;
    }

    .modal-title-area { flex: 1; min-width: 0; }

    .modal-gname {
      font-size: 22px;
      font-weight: 800;
      color: white;
      text-shadow: 0 1px 6px rgba(0,0,0,0.2);
    }

    .modal-gtopic {
      font-size: 15px;
      color: rgba(255,255,255,0.85);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-close-btn:hover { background: rgba(255,255,255,0.35); }

    .modal-body { padding: 30px 30px 10px; }

    .detail-sec { margin-bottom: 26px; }

    .detail-sec h3 {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .detail-sec p {
      font-size: 15px;
      color: #334155;
      line-height: 1.75;
      white-space: pre-line;
    }

    .member-tags { display: flex; flex-wrap: wrap; gap: 8px; }

    .mtag {
      padding: 7px 15px;
      background: linear-gradient(135deg, #ede9fe, #fce7f3);
      color: #6366f1;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 600;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      background: #f1f5f9;
    }

    .video-box iframe { width: 100%; height: 100%; border: none; }

    .video-ext-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      background: linear-gradient(135deg, #fee2e2, #fef3c7);
      color: #dc2626;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: 0.2s;
    }

    .video-ext-link:hover { filter: brightness(0.95); transform: translateY(-1px); }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .gal-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 11px;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid transparent;
    }

    .gal-img:hover { transform: scale(1.04); border-color: #6366f1; }

    .modal-ft {
      padding: 18px 30px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 10px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 13px 26px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      z-index: 500;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      white-space: nowrap;
    }

    /* ===== Section divider ===== */
    .section-divider {
      border: none;
      height: 1px;
      background: #f1f5f9;
      margin: 6px 0 24px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .form-wrap { padding: 24px 18px; }
      .modal-body { padding: 20px 18px; }
      .modal-ft { padding: 14px 18px; }
      .modal-hd { padding: 20px 18px; }
      .home-header h1 { font-size: 26px; }
      .topbar-logo { font-size: 15px; }
      .nav-btn { padding: 7px 13px; font-size: 13px; }
      .dyn-row .sub-input { width: 100px; }
    }
  </style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-logo">🎓 期末報告作品集</div>
    <button class="nav-btn active" id="nav-home" onclick="showView('home')">📋 全部組別</button>
    <button class="nav-btn" id="nav-add" onclick="showView('add')">➕ 新增組別</button>
  </div>
</div>

<!-- ===== Home View ===== -->
<div id="view-home" class="view active">
  <div class="container">
    <div class="home-header">
      <h1>分組期末報告</h1>
      <p id="home-sub">載入中…</p>
    </div>
    <div id="groups-container">
      <div class="loading-msg">⏳ 載入組別資料…</div>
    </div>
  </div>
</div>

<!-- ===== Form View (Add / Edit) ===== -->
<div id="view-form" class="view">
  <div class="container">
    <div class="form-wrap">
      <div class="form-heading" id="form-heading">➕ 新增組別</div>
      <input type="hidden" id="edit-id">

      <div class="form-group">
        <label>🏷️ 組別名稱</label>
        <input type="text" id="f-name" placeholder="例：第一組、B 組、資訊組…">
      </div>

      <div class="form-group">
        <label>🎯 報告主題</label>
        <input type="text" id="f-topic" placeholder="作品或報告的主題名稱">
      </div>

      <hr class="section-divider">

      <div class="form-group">
        <label>👥 成員與分工</label>
        <div class="dyn-list" id="members-list"></div>
        <button type="button" class="btn-add-row" onclick="addMemberRow()">＋ 新增成員</button>
      </div>

      <hr class="section-divider">

      <div class="form-group">
        <label>🎬 影片</label>
        <input type="url" id="f-video" placeholder="貼上 YouTube / Google Drive 連結">
        <div style="margin:10px 0;display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:13px">
          <div style="flex:1;height:1px;background:#e2e8f0"></div>或直接上傳影片檔案<div style="flex:1;height:1px;background:#e2e8f0"></div>
        </div>
        <label id="video-upload-label" style="display:flex;align-items:center;gap:10px;padding:13px 16px;border:2px dashed #c7d2fe;border-radius:13px;cursor:pointer;transition:0.2s;font-weight:400;text-transform:none;letter-spacing:0;color:#475569;font-size:14px" onmouseover="this.style.borderColor='#6366f1'" onmouseout="this.style.borderColor='#c7d2fe'">
          <span style="font-size:22px">🎥</span>
          <span id="video-upload-text">選擇影片檔案（MP4、MOV、AVI 等）</span>
          <input type="file" id="video-file-input" accept="video/*" style="display:none" onchange="uploadVideoFile(this)">
        </label>
        <div id="storage-gauge" style="margin-top:10px"></div>
        <div id="video-upload-progress" style="display:none;margin-top:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:5px">
            <span id="video-upload-name"></span><span id="video-upload-pct">0%</span>
          </div>
          <div style="background:#e2e8f0;border-radius:99px;height:7px;overflow:hidden">
            <div id="video-progress-bar" style="height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);width:0;transition:width 0.2s"></div>
          </div>
        </div>
        <div id="video-preview-wrap" style="margin-top:10px;display:none">
          <div class="video-box"><iframe id="video-preview-frame" allowfullscreen></iframe></div>
        </div>
        <div id="video-native-preview" style="margin-top:10px;display:none">
          <video id="video-native-player" controls style="width:100%;border-radius:14px;background:#000"></video>
        </div>
      </div>

      <div class="form-group">
        <label>🖼️ 照片連結（可多張）</label>
        <div class="dyn-list" id="photos-list"></div>
        <button type="button" class="btn-add-row" onclick="addPhotoRow()">＋ 新增照片</button>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-primary" onclick="saveGroup()">💾 儲存</button>
        <button type="button" class="btn-secondary" onclick="showView('home')">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Detail Modal ===== -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-hd" id="modal-hd">
      <div class="modal-num" id="m-num"></div>
      <div class="modal-title-area">
        <div class="modal-gname" id="m-name"></div>
        <div class="modal-gtopic" id="m-topic"></div>
      </div>
      <button class="modal-close-btn" onclick="closeOverlay()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-ft">
      <button class="btn-primary" onclick="editFromModal()">✏️ 編輯</button>
      <button class="btn-secondary" onclick="closeOverlay()">關閉</button>
    </div>
  </div>
</div>

<!-- ===== FAB ===== -->
<button class="fab" id="fab" onclick="showView('add')" title="新增組別">＋</button>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
// ===== Firebase helpers =====
const DB_URL = FIREBASE_CONFIG.databaseURL;

async function fbGet(path) {
  const r = await fetch(`${DB_URL}/${path}.json`);
  if (!r.ok) throw new Error(`讀取失敗 (${r.status})`);
  return r.json();
}

async function fbPut(path, data) {
  const r = await fetch(`${DB_URL}/${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`儲存失敗 (${r.status})`);
  return r.json();
}

async function fbPost(path, data) {
  const r = await fetch(`${DB_URL}/${path}.json`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`新增失敗 (${r.status})`);
  return r.json();
}

async function fbDelete(path) {
  const r = await fetch(`${DB_URL}/${path}.json`, { method: 'DELETE' });
  if (!r.ok) throw new Error(`刪除失敗 (${r.status})`);
}

// ===== State =====
let allGroups = {};
let currentModalId = null;
const COLORS = ['c0','c1','c2','c3','c4','c5','c6','c7','c8','c9'];

// ===== View management =====
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('fab').style.display = 'none';

  if (name === 'home') {
    document.getElementById('view-home').classList.add('active');
    document.getElementById('nav-home').classList.add('active');
    document.getElementById('fab').style.display = 'flex';
    loadGroups();
  } else if (name === 'add') {
    document.getElementById('view-form').classList.add('active');
    document.getElementById('nav-add').classList.add('active');
    resetForm();
    document.getElementById('form-heading').textContent = '➕ 新增組別';
    document.getElementById('edit-id').value = '';
    updateStorageDisplay();
  } else if (name === 'edit') {
    document.getElementById('view-form').classList.add('active');
    document.getElementById('nav-add').classList.add('active');
  }
}

// ===== Load & render groups =====
async function loadGroups() {
  const container = document.getElementById('groups-container');
  container.innerHTML = '<div class="loading-msg">⏳ 載入組別資料…</div>';
  try {
    const data = await fbGet('group_reports');
    allGroups = data || {};
    renderGroups(allGroups);
  } catch(e) {
    container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h2>載入失敗</h2><p>${e.message}</p></div>`;
  }
}

function renderGroups(groups) {
  const container = document.getElementById('groups-container');
  const entries = Object.entries(groups).sort((a, b) => (a[1].number||0) - (b[1].number||0));
  const sub = document.getElementById('home-sub');

  if (entries.length === 0) {
    sub.textContent = '目前沒有任何組別';
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📂</div>
        <h2>還沒有任何組別</h2>
        <p>點擊右下方 ＋ 按鈕新增第一個組別</p>
      </div>`;
    return;
  }

  sub.textContent = `共 ${entries.length} 組 · 點擊組別卡片查看詳細內容`;
  container.innerHTML = `<div class="groups-grid">${entries.map(([id, g], i) => cardHtml(id, g, i)).join('')}</div>`;
}

function cardHtml(id, g, idx) {
  const cc = COLORS[idx % COLORS.length];
  const members = splitLines(g.members);
  const chips = members.slice(0, 4).map(m => `<span class="chip">${m.split(/[－—\-]/)[0].trim()}</span>`).join('');
  const moreChip = members.length > 4 ? `<span class="chip more">+${members.length - 4} 人</span>` : '';
  const topicDisplay = g.topic ? escHtml(g.topic) : '<span style="color:#94a3b8">（尚未填寫主題）</span>';
  const nameDisplay = g.name ? escHtml(g.name) : '未命名組別';

  return `
    <div class="group-card" onclick="openDetail('${id}')">
      <div class="card-header ${cc}">
        <div class="card-num">${g.number || idx+1}</div>
        <div class="card-group-name">${nameDisplay}</div>
      </div>
      <div class="card-body">
        <div class="card-topic">🎯 ${topicDisplay}</div>
        <div class="card-chips">${chips}${moreChip}</div>
      </div>
      <div class="card-footer">
        <button class="btn-sm btn-view" onclick="event.stopPropagation();openDetail('${id}')">👁 查看</button>
        <button class="btn-sm btn-edit" onclick="event.stopPropagation();openEdit('${id}')">✏️ 編輯</button>
        <button class="btn-sm btn-del"  onclick="event.stopPropagation();deleteGroup('${id}')">🗑</button>
      </div>
    </div>`;
}

// ===== Detail Modal =====
function openDetail(id) {
  const g = allGroups[id];
  if (!g) return;
  currentModalId = id;

  const entries = Object.keys(allGroups).sort((a, b) => (allGroups[a].number||0) - (allGroups[b].number||0));
  const idx = entries.indexOf(id);
  const cc  = COLORS[idx % COLORS.length];

  document.getElementById('modal-hd').className = `modal-hd ${cc}`;
  document.getElementById('m-num').textContent   = g.number || idx+1;
  document.getElementById('m-name').textContent  = g.name  || '未命名';
  document.getElementById('m-topic').textContent = g.topic || '';

  let html = '';

  // Members
  const members = splitLines(g.members);
  if (members.length) {
    html += `<div class="detail-sec">
      <h3>👥 成員與分工</h3>
      <div class="member-tags">${members.map(m => `<span class="mtag">${escHtml(m)}</span>`).join('')}</div>
    </div>`;
  }

  // Video
  if (g.video?.trim()) {
    const yid = getYouTubeId(g.video);
    const driveUrl = getDriveEmbedUrl(g.video);
    html += `<div class="detail-sec"><h3>🎬 影片</h3>`;
    if (yid) {
      html += `<div class="video-box"><iframe src="https://www.youtube.com/embed/${yid}" allowfullscreen></iframe></div>`;
    } else if (driveUrl) {
      html += `<div class="video-box"><iframe src="${escAttr(driveUrl)}" allowfullscreen></iframe></div>`;
    } else if (g.video.includes('firebasestorage.googleapis.com')) {
      html += `<video controls style="width:100%;border-radius:14px;background:#000" src="${escAttr(g.video)}"></video>`;
    } else {
      html += `<a href="${escHtml(g.video)}" target="_blank" rel="noopener" class="video-ext-link">▶ 開啟影片連結</a>`;
    }
    html += `</div>`;
  }

  // Photos
  const photos = splitLines(g.photos);
  if (photos.length) {
    html += `<div class="detail-sec"><h3>🖼️ 照片</h3>
      <div class="photo-gallery">
        ${photos.map(url => `<img class="gal-img" src="${escAttr(url)}" alt="照片" onclick="window.open('${escAttr(url)}','_blank')" onerror="this.style.display='none'">`).join('')}
      </div></div>`;
  }

  document.getElementById('modal-body').innerHTML = html || '<p style="color:#94a3b8;text-align:center;padding:40px 0">尚無詳細內容</p>';

  document.getElementById('overlay').classList.add('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeOverlay();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}

function editFromModal() {
  closeOverlay();
  openEdit(currentModalId);
}

function getYouTubeId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function getDriveEmbedUrl(url) {
  // 支援 drive.google.com/file/d/ID/view 或 /open?id=ID
  let m = url.match(/drive\.google\.com\/file\/d\/([^/\?&]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = url.match(/[?&]id=([^&]+)/);
  if (m && url.includes('drive.google.com')) return `https://drive.google.com/file/d/${m[1]}/preview`;
  return null;
}

// ===== Open Edit =====
function openEdit(id) {
  const g = allGroups[id];
  if (!g) return;

  showView('edit');
  document.getElementById('form-heading').textContent = '✏️ 編輯組別';
  document.getElementById('edit-id').value = id;

  document.getElementById('f-name').value     = g.name     || '';
  document.getElementById('f-topic').value    = g.topic    || '';
  document.getElementById('f-video').value    = g.video    || '';

  // Reset video upload UI
  document.getElementById('video-upload-progress').style.display = 'none';
  document.getElementById('video-file-input').value = '';
  document.getElementById('video-upload-text').textContent = '選擇影片檔案（MP4、MOV、AVI 等，建議 500MB 以內）';

  // Members
  const ml = document.getElementById('members-list');
  ml.innerHTML = '';
  const members = splitLines(g.members);
  if (members.length) {
    members.forEach(m => {
      const sep = m.match(/[－—\-]/);
      if (sep) {
        const splitIdx = m.indexOf(sep[0]);
        addMemberRow(m.slice(0, splitIdx).trim(), m.slice(splitIdx + 1).trim());
      } else {
        addMemberRow(m);
      }
    });
  } else addMemberRow();

  // Photos
  const pl = document.getElementById('photos-list');
  pl.innerHTML = '';
  const photos = splitLines(g.photos);
  if (photos.length) photos.forEach(p => addPhotoRow(p));
  else addPhotoRow();

  // Video preview
  updateVideoPreview(g.video || '');
  updateStorageDisplay();
}

// ===== Form reset =====
function resetForm() {
  ['f-name','f-topic','f-video'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('video-upload-progress').style.display = 'none';
  document.getElementById('video-native-preview').style.display = 'none';
  document.getElementById('video-upload-text').textContent = '選擇影片檔案（MP4、MOV、AVI 等，建議 500MB 以內）';
  document.getElementById('video-file-input').value = '';

  const ml = document.getElementById('members-list');
  ml.innerHTML = '';
  addMemberRow();

  const pl = document.getElementById('photos-list');
  pl.innerHTML = '';
  addPhotoRow();

  document.getElementById('video-preview-wrap').style.display = 'none';
}

// ===== Dynamic member rows =====
function addMemberRow(name = '', role = '') {
  const d = document.createElement('div');
  d.className = 'dyn-row';
  d.innerHTML = `
    <input type="text" placeholder="姓名" value="${escAttr(name)}" style="flex:1.2">
    <input type="text" placeholder="分工（程式、簡報…）" value="${escAttr(role)}" class="sub-input">
    <button type="button" class="btn-rm" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('members-list').appendChild(d);
}

// ===== Dynamic photo rows =====
function addPhotoRow(url = '') {
  const d = document.createElement('div');
  d.className = 'dyn-row';
  d.innerHTML = `
    <input type="url" placeholder="照片網址（https://…）" value="${escAttr(url)}" oninput="previewPhoto(this)">
    <img class="photo-thumb" alt="預覽">
    <button type="button" class="btn-rm" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('photos-list').appendChild(d);
  if (url) {
    const img = d.querySelector('.photo-thumb');
    img.src = url;
    img.style.display = 'block';
    img.onerror = () => { img.style.display = 'none'; };
  }
}

function previewPhoto(input) {
  const img = input.nextElementSibling;
  if (input.value) {
    img.src = input.value;
    img.style.display = 'block';
    img.onerror = () => { img.style.display = 'none'; };
  } else {
    img.style.display = 'none';
  }
}

// ===== Video preview in form =====
document.getElementById('f-video').addEventListener('input', function() {
  updateVideoPreview(this.value.trim());
});

function updateVideoPreview(url) {
  const wrap   = document.getElementById('video-preview-wrap');
  const frame  = document.getElementById('video-preview-frame');
  const native = document.getElementById('video-native-preview');
  const player = document.getElementById('video-native-player');
  const yid      = getYouTubeId(url);
  const driveUrl = getDriveEmbedUrl(url);
  if (yid) {
    frame.src = `https://www.youtube.com/embed/${yid}`;
    wrap.style.display = 'block';
    native.style.display = 'none';
  } else if (driveUrl) {
    frame.src = driveUrl;
    wrap.style.display = 'block';
    native.style.display = 'none';
  } else if (url && url.includes('firebasestorage.googleapis.com')) {
    player.src = url;
    native.style.display = 'block';
    wrap.style.display = 'none';
  } else {
    frame.src = '';
    wrap.style.display = 'none';
    native.style.display = 'none';
  }
}

// ===== Video file upload =====
async function uploadVideoFile(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > 1 * 1024 * 1024 * 1024) {
    if (!confirm(`這個影片有 ${(file.size/1024/1024).toFixed(0)}MB，非常大，確定要上傳嗎？`)) return;
  }

  const bucket = FIREBASE_CONFIG.storageBucket;
  const apiKey = FIREBASE_CONFIG.apiKey;
  const ts = Date.now();
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `group_videos/${ts}_${safeName}`;
  const encodedPath = encodeURIComponent(path);

  document.getElementById('video-upload-name').textContent = file.name;
  document.getElementById('video-upload-progress').style.display = 'block';
  document.getElementById('video-upload-pct').textContent = '啟動中…';
  document.getElementById('video-progress-bar').style.width = '0';
  document.getElementById('video-upload-text').textContent = '上傳中…';

  try {
    // Step 1: 建立 resumable upload session（支援大檔案）
    const initUrl = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o?uploadType=resumable&name=${encodedPath}&key=${apiKey}`;
    const initRes = await fetch(initUrl, {
      method: 'POST',
      headers: {
        'X-Goog-Upload-Protocol': 'resumable',
        'X-Goog-Upload-Command': 'start',
        'X-Goog-Upload-Content-Type': file.type || 'video/mp4',
        'X-Goog-Upload-Content-Length': String(file.size),
        'Content-Type': 'application/json',
      },
      body: '{}'
    });
    if (!initRes.ok) throw new Error(`初始化失敗 (${initRes.status})`);
    const sessionUri = initRes.headers.get('X-Goog-Upload-URL');
    if (!sessionUri) throw new Error('無法取得上傳位址（可能是 Storage 規則未開放）');

    // Step 2: 上傳檔案（帶進度）
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', sessionUri);
      xhr.setRequestHeader('X-Goog-Upload-Command', 'upload, finalize');
      xhr.setRequestHeader('X-Goog-Upload-Offset', '0');
      xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          const loaded = (e.loaded / 1024 / 1024).toFixed(1);
          const total  = (e.total  / 1024 / 1024).toFixed(1);
          document.getElementById('video-upload-pct').textContent = `${pct}%`;
          document.getElementById('video-upload-name').textContent = `${file.name}  (${loaded} / ${total} MB)`;
          document.getElementById('video-progress-bar').style.width = pct + '%';
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve();
        else reject(new Error(`上傳失敗 (${xhr.status})`));
      };
      xhr.onerror = () => reject(new Error('網路錯誤'));
      xhr.send(file);
    });

    const downloadUrl = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodedPath}?alt=media`;
    document.getElementById('f-video').value = downloadUrl;
    document.getElementById('video-upload-text').textContent = '✅ 上傳完成：' + file.name;
    document.getElementById('video-upload-pct').textContent = '100%';

    // 記錄使用量
    await trackStorageUsage(file.size);
    await updateStorageDisplay();

    // 播放預覽
    document.getElementById('video-native-player').src = downloadUrl;
    document.getElementById('video-native-preview').style.display = 'block';
    document.getElementById('video-preview-wrap').style.display = 'none';

  } catch(e) {
    document.getElementById('video-upload-text').textContent = '❌ ' + e.message;
    showToast('影片上傳失敗：' + e.message);
  }
}

async function updateStorageDisplay() {
  const el = document.getElementById('storage-gauge');
  if (!el) return;
  el.innerHTML = '<span style="font-size:12px;color:#94a3b8">載入中…</span>';
  try {
    const bucket = FIREBASE_CONFIG.storageBucket;
    const apiKey = FIREBASE_CONFIG.apiKey;
    // 列出 group_videos/ 目錄下所有檔案，加總實際大小
    let usedBytes = 0;
    let pageToken = '';
    do {
      const tokenParam = pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '';
      const res = await fetch(
        `https://firebasestorage.googleapis.com/v0/b/${bucket}/o?prefix=group_videos%2F&maxResults=100${tokenParam}&key=${apiKey}`
      );
      if (!res.ok) throw new Error(`列上失敗 (${res.status})`);
      const data = await res.json();
      (data.items || []).forEach(item => { usedBytes += parseInt(item.size || 0, 10); });
      pageToken = data.nextPageToken || '';
    } while (pageToken);

    const totalBytes = 5 * 1024 * 1024 * 1024;
    const usedMB  = (usedBytes / 1024 / 1024).toFixed(1);
    const remainMB = ((totalBytes - usedBytes) / 1024 / 1024).toFixed(0);
    const pct     = Math.min(100, usedBytes / totalBytes * 100);
    const color   = pct > 80 ? '#ef4444' : pct > 60 ? '#f59e0b' : '#6366f1';
    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:4px">
        <span>🗄️ 影片空間（實際用量）</span>
        <span style="color:${color};font-weight:600">${usedMB} MB 已用　剩餘約 ${remainMB} MB / 5,120 MB</span>
      </div>
      <div style="background:#e2e8f0;border-radius:99px;height:6px;overflow:hidden">
        <div style="height:100%;background:${color};width:${pct.toFixed(1)}%;transition:width 0.5s"></div>
      </div>`;
  } catch(e) {
    el.innerHTML = `<span style="font-size:12px;color:#94a3b8">🗄️ 無法讀取空間使用量：${e.message}</span>`;
  }
}

// ===== Save =====
async function saveGroup() {
  const id    = document.getElementById('edit-id').value;
  const name  = document.getElementById('f-name').value.trim();
  const topic = document.getElementById('f-topic').value.trim();

  if (!name)  { showToast('❌ 請填寫組別名稱'); return; }
  if (!topic) { showToast('❌ 請填寫主題'); return; }

  // Collect members: "姓名\t職責" joined by \n
  const members = Array.from(document.querySelectorAll('#members-list .dyn-row')).map(row => {
    const inputs = row.querySelectorAll('input');
    const n = inputs[0].value.trim();
    const r = inputs[1].value.trim();
    if (!n) return '';
    return r ? `${n} — ${r}` : n;
  }).filter(Boolean).join('\n');

  const photos = Array.from(document.querySelectorAll('#photos-list input[type=url]'))
    .map(i => i.value.trim()).filter(Boolean).join('\n');

  let number;
  if (id) {
    number = allGroups[id]?.number;
  } else {
    const nums = Object.values(allGroups).map(g => g.number || 0);
    number = nums.length > 0 ? Math.max(...nums) + 1 : 1;
  }

  const data = {
    name, topic, members,
    video:    document.getElementById('f-video').value.trim(),
    photos,
    number,
    updated_at: new Date().toISOString()
  };
  if (!id) data.created_at = new Date().toISOString();

  try {
    if (id) {
      await fbPut(`group_reports/${id}`, data);
      showToast('✅ 更新成功');
    } else {
      await fbPost('group_reports', data);
      showToast('✅ 新增成功');
    }
    showView('home');
  } catch(e) {
    showToast('❌ 儲存失敗：' + e.message);
  }
}

// ===== Delete =====
async function deleteGroup(id) {
  const g = allGroups[id];
  if (!confirm(`確定要刪除「${g?.name || '此組別'}」嗎？`)) return;
  try {
    await fbDelete(`group_reports/${id}`);
    showToast('🗑 已刪除');
    loadGroups();
  } catch(e) {
    showToast('❌ 刪除失敗：' + e.message);
  }
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// ===== Utils =====
function splitLines(str) {
  return (str || '').split('\n').map(s => s.trim()).filter(Boolean);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escAttr(str) {
  return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ===== Init =====
showView('home');
